<style>
:root{--bg:#0a0d0b;--panel:#12160f;--panel-edge:#23281f;--rust:#7a3524;--signal-red:#d1382c;--amber:#d1a13d;--paper:#d9d3bf;--muted:#6c7266}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--paper);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;padding:24px}
#gate{width:100%;max-width:520px;border:1px solid var(--panel-edge);background:var(--panel);padding:32px 26px;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 0 30px rgba(209,56,44,.06)}
.tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
h1{font-family:'Black Ops One','IBM Plex Mono',monospace;letter-spacing:3px;font-weight:400;font-size:28px;margin:0 0 18px;color:var(--paper)}
.clue{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 20px}
.clue b{color:var(--paper);font-weight:500}
input{width:100%;background:#0a0d0b;border:1px solid var(--panel-edge);color:var(--paper);font:inherit;font-size:16px;padding:12px 14px;letter-spacing:2px;outline:none}
input:focus{border-color:var(--signal-red)}
button{margin-top:12px;width:100%;background:transparent;color:var(--signal-red);border:1px solid var(--signal-red);font:inherit;letter-spacing:3px;text-transform:uppercase;font-size:12px;padding:12px;cursor:pointer}
button:hover{background:var(--signal-red);color:#fff}
#msg{min-height:20px;margin-top:14px;font-size:12px;letter-spacing:2px;color:var(--signal-red)}
a.back{display:inline-block;margin-top:18px;font-size:11px;letter-spacing:3px;color:var(--muted);text-decoration:none}
a.back:hover{color:var(--amber)}
</style></head>

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a;}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
function launch(p){
  var st=document.createElement('style');st.textContent=p.css;document.head.appendChild(st);
  document.body.removeAttribute('style');document.body.innerHTML=p.body;
  document.body.style.display='block';document.body.style.padding='0';
  document.title="YAR: Joy's Tale";
  var sc=document.createElement('script');sc.textContent=p.js;document.body.appendChild(sc);
}
var msg=document.getElementById('msg');
function norm(v){return v.trim().toLowerCase();}
try{var saved=sessionStorage.getItem('sj_k');if(saved){open(saved).then(launch).catch(function(){});}}catch(e){}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var pw=norm(document.getElementById('pw').value);
  if(!pw){return;}
  msg.textContent='VERIFYING...';
  try{
    var p=await open(pw);
    try{sessionStorage.setItem('sj_k',pw);}catch(e){}
    launch(p);
  }catch(err){
    msg.textContent='ACCESS DENIED';
    document.getElementById('pw').select();
  }
});
})();
