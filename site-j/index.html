<style>
  :root{--bg:#0a0d0b;--panel:#12160f;--edge:#23281f;--rust:#7a3524;--red:#d1382c;--amber:#d1a13d;--paper:#d9d3bf;--muted:#6c7266}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--paper);font-family:'IBM Plex Mono',monospace;padding:24px 16px}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
  .box{position:relative;width:100%;max-width:460px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:28px 22px;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 0 30px rgba(209,56,44,.08)}
  .tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
  h1{font-family:'Black Ops One','IBM Plex Mono',monospace;font-weight:400;letter-spacing:2px;font-size:24px;margin:0 0 18px;color:var(--paper)}
  .clue{font-size:14px;line-height:1.6;border-left:2px solid var(--red);padding-left:12px;margin:0 0 20px}
  .clue span{display:block;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  form{display:flex;gap:8px}
  input{flex:1;min-width:0;font:inherit;font-size:16px;background:#0b0e0a;color:var(--paper);border:1px solid var(--edge);border-radius:6px;padding:11px 12px;letter-spacing:2px;text-transform:uppercase}
  input:focus{outline:none;border-color:var(--red)}
  button{font:inherit;font-size:12px;letter-spacing:3px;background:transparent;color:var(--red);border:1px solid var(--rust);border-radius:6px;padding:0 14px;cursor:pointer}
  button:hover{border-color:var(--red)}
  #msg{min-height:20px;margin-top:12px;font-size:12px;letter-spacing:2px;color:var(--red)}
  .warn{margin-top:18px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .back{display:inline-block;margin-top:18px;font-size:11px;letter-spacing:2px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--paper)}
  .shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(CT));
  return new TextDecoder().decode(pt);
}
const f=document.getElementById("f"),pw=document.getElementById("pw"),msg=document.getElementById("msg"),box=document.getElementById("box");
f.addEventListener("submit",async e=>{
  e.preventDefault();
  msg.textContent="DECRYPTING…";
  try{
    const html=await unlock(pw.value.trim().toLowerCase());
    document.open();document.write(html);document.close();
  }catch(err){
    msg.textContent="ACCESS DENIED";
    box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");
    pw.select();
  }
});
